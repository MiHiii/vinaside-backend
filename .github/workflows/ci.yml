name: CI Pipeline

on:
  push:
    branches:
      - develop
      - release
      - main
  # pull_request:
  #   branches:
  #     - develop
  #     - release
  #     - main

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: 🛠️ Checkout code
        uses: actions/checkout@v3

      - name: 🔍 Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '22.11.0'
          cache: 'npm'

      - name: 📦 Install dependencies
        run: npm ci

      - name: ✅ Run Lint
        run: npx eslint . --ext .js,.ts

      - name: 🏗️ Run Build
        run: npm run build

      - name: 🔬 Run Tests
        run: npm run test -- --passWithNoTests
